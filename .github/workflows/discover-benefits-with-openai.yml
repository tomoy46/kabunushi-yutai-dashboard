name: Discover shareholder benefits with OpenAI
on:
  workflow_dispatch:
    inputs:
      batch_size: {description: 'Companies per run', default: '5', type: string}
      daily_limit: {description: 'Maximum companies per run', default: '20', type: string}
      security_codes: {description: 'Security codes (comma-separated, e.g. 7550,9861,8163)', required: false, type: string}
      retry_failed: {description: 'Retry failed companies', default: false, type: boolean}
      official_only: {description: 'Only register fully official results', default: true, type: boolean}
      diagnostic_mode: {description: 'Diagnose code 1301 without changing data', default: false, type: boolean}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: openai-benefit-discovery, cancel-in-progress: false}
jobs:
  discover:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and verify PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Log workflow inputs
        env:
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          SECURITY_CODES: ${{ inputs.security_codes }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DAILY_LIMIT: ${{ inputs.daily_limit }}
        run: |
          echo "diagnostic_mode=${DIAGNOSTIC_MODE}"
          echo "security_codes=${SECURITY_CODES}"
          echo "batch_size=${BATCH_SIZE}"
          echo "daily_limit=${DAILY_LIMIT}"
      - name: Test before using the production API
        run: npm test
      - name: Verify maintained official sources over real HTTP
        env:
          RUN_LIVE_OFFICIAL_SOURCES: '1'
        run: python -m unittest discover -s tests -p 'test_live_official_sources.py' -v
      - name: Discover from official sources
        id: discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: >-
          python scripts/discover_benefits_with_openai.py
          --batch-size '${{ inputs.batch_size }}'
          --daily-limit '${{ inputs.daily_limit }}'
          --security-codes '${{ inputs.security_codes }}'
          ${{ inputs.retry_failed == true && '--retry-failed' || '' }}
          ${{ inputs.official_only == true && '--official-only' || '' }}
          ${{ inputs.diagnostic_mode == true && '--diagnostic-mode' || '' }}
      - name: Commit verified results
        id: commit_results
        # Per-company research failures are recorded without failing discovery,
        # so confirmed results still reach this step. A failed test or structural
        # discovery failure blocks the step via success().
        if: ${{ success() && inputs.diagnostic_mode != true }}
        env:
          CONFIRMED_COUNT: ${{ steps.discovery.outputs.confirmed }}
          RESEARCH_LOG_COUNT: ${{ steps.discovery.outputs.research_log }}
          FAILED_COUNT: ${{ steps.discovery.outputs.failed }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/benefits.csv data/benefits.json data/verification-queue.json data/discovery-progress.json data/research-log.json data/openai-api-usage.json data/official-benefit-sources.json
          echo "Changed files and added/updated record counts before commit:"
          python - <<'PY'
          import csv, io, json, pathlib, subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--", "data"], text=True
          ).splitlines()
          for filename in changed:
              path = pathlib.Path(filename)
              current_text = path.read_text(encoding="utf-8")
              try:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{filename}"], text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  previous_text = ""
              if path.suffix == ".csv":
                  current = {row.get("code", str(index)): row for index, row in enumerate(csv.DictReader(io.StringIO(current_text)))}
                  previous = {row.get("code", str(index)): row for index, row in enumerate(csv.DictReader(io.StringIO(previous_text)))}
              else:
                  current_value = json.loads(current_text)
                  previous_value = json.loads(previous_text) if previous_text else []
                  if isinstance(current_value, list):
                      current = {str(row.get("code", index)) if isinstance(row, dict) else str(index): row
                                 for index, row in enumerate(current_value)}
                      previous = {str(row.get("code", index)) if isinstance(row, dict) else str(index): row
                                  for index, row in enumerate(previous_value)}
                  else:
                      current, previous = {"document": current_value}, {"document": previous_value}
              added = len(current.keys() - previous.keys())
              updated = sum(current[key] != previous[key] for key in current.keys() & previous.keys())
              print(f"{filename}: added={added} updated={updated}")
          PY
          echo "Changed line counts:"
          git diff --cached --numstat
          if git diff --cached --quiet; then
            echo "::warning::No data files changed: discovery selected no eligible targets, or every generated value already matches Git. No commit was created."
            committed=no
          else
            git commit -m "chore: update OpenAI benefit discovery"
            git push
            committed=yes
          fi
          echo "committed=${committed}" >> "$GITHUB_OUTPUT"
      - name: Configure GitHub Pages
        if: ${{ steps.commit_results.outputs.committed == 'yes' }}
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: ${{ steps.commit_results.outputs.committed == 'yes' }}
        uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - name: Deploy GitHub Pages
        if: ${{ steps.commit_results.outputs.committed == 'yes' }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed shareholder benefits
        if: ${{ steps.commit_results.outputs.committed == 'yes' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"{os.environ['PAGE_URL'].rstrip('/')}/data/benefits.json?v={os.environ['CACHE_BUSTER']}"
          expected_codes = {'7550', '7616', '7412'}
          with open('data/benefits.json', encoding='utf-8') as local_file:
              local_benefits = json.load(local_file)
          expected_confirmed = sum(
              item.get('benefit_status') == 'official_confirmed' for item in local_benefits
          )
          last_error = None
          for attempt in range(1, 13):
              confirmed = None
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      benefits = json.load(response)
                  codes = {str(item.get('code')) for item in benefits}
                  missing = expected_codes - codes
                  confirmed = sum(item.get('benefit_status') == 'official_confirmed' for item in benefits)
                  print(
                      f"Attempt {attempt}/12: expected official_confirmed={expected_confirmed}, "
                      f"actual official_confirmed={confirmed}"
                  )
                  if missing:
                      raise AssertionError(f"公開データに証券コードがありません: {sorted(missing)}")
                  if confirmed != expected_confirmed:
                      raise AssertionError(
                          "公開サイトとローカルデータの公式確認済み件数が一致しません: "
                          f"expected={expected_confirmed}, actual={confirmed}"
                      )
                  print(f"Verified {url}: required codes present, official_confirmed={confirmed}")
                  break
              except Exception as error:
                  last_error = error
                  if confirmed is None:
                      print(
                          f"Attempt {attempt}/12: expected official_confirmed={expected_confirmed}, "
                          "actual official_confirmed=unavailable"
                      )
                  if attempt == 12:
                      raise
                  print(f"Attempt {attempt}/12 failed: {error}; retrying in 10 seconds")
                  time.sleep(10)
          PY
      - name: Report workflow outcome
        if: ${{ always() }}
        env:
          CONFIRMED_COUNT: ${{ steps.discovery.outputs.confirmed }}
          RESEARCH_LOG_COUNT: ${{ steps.discovery.outputs.research_log }}
          FAILED_COUNT: ${{ steps.discovery.outputs.failed }}
          OPENAI_CALLS: ${{ steps.discovery.outputs.openai_calls }}
          ZERO_CONFIRMED_CAUSE: ${{ steps.discovery.outputs.zero_confirmed_cause }}
          COMMITTED: ${{ steps.commit_results.outputs.committed }}
        run: |
          committed="${COMMITTED:-no}"
          echo "WORKFLOW SUMMARY: confirmed saved=${CONFIRMED_COUNT:-0} research-log saved=${RESEARCH_LOG_COUNT:-0} failed=${FAILED_COUNT:-0} git committed=${committed}"
          if [ "${CONFIRMED_COUNT:-0}" = 0 ]; then
            echo "::warning::confirmed=0; OpenAI calls=${OPENAI_CALLS:-0}; cause=${ZERO_CONFIRMED_CAUSE:-not_reported}"
          fi
          {
            echo "### Shareholder benefit discovery"
            echo "- confirmedとして保存: ${CONFIRMED_COUNT:-0}"
            echo "- research-logへ保存: ${RESEARCH_LOG_COUNT:-0}"
            echo "- failed: ${FAILED_COUNT:-0}"
            echo "- OpenAI API calls: ${OPENAI_CALLS:-0}"
            echo "- confirmed=0 の原因: ${ZERO_CONFIRMED_CAUSE:-該当なし}"
            echo "- Gitへコミット: ${committed}"
          } >> "$GITHUB_STEP_SUMMARY"
