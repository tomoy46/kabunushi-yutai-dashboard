name: Discover shareholder benefits with OpenAI
on:
  workflow_dispatch:
    inputs:
      auto_select: {description: 'Auto select unresearched companies', default: true, type: boolean}
      companies_per_run: {description: 'Companies per run', default: '25', type: string}
      max_openai_calls_per_run: {description: 'Maximum OpenAI calls per run', default: '25', type: string}
      max_openai_calls_per_day: {description: 'Maximum OpenAI calls per day', default: '100', type: string}
      max_openai_budget_jpy_per_day: {description: 'Maximum OpenAI budget per day in JPY', default: '100', type: string}
      security_codes: {description: 'Security codes (comma-separated, e.g. 7550,9861,8163)', required: false, type: string}
      retry_research_log: {description: 'Retry research-log companies', default: false, type: boolean}
      retry_failed: {description: 'Retry failed companies', default: false, type: boolean}
      official_only: {description: 'Only register fully official results', default: true, type: boolean}
      diagnostic_mode: {description: 'Diagnose code 1301 without changing data', default: false, type: boolean}
      selection_diagnostic: {description: 'Select at least 5 real companies and stop before OpenAI (free)', default: false, type: boolean}
permissions: {contents: write, pages: write, id-token: write}
concurrency: {group: shareholder-data-main, cancel-in-progress: false}
jobs:
  discover:
    environment: {name: github-pages, url: '${{ steps.deployment.outputs.page_url }}'}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Initialize recovery bundle
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          REQUESTED_SECURITY_CODES: ${{ inputs.security_codes }}
        run: |
          mkdir -p recovery-results
          python - <<'PY'
          import datetime, json, os, pathlib
          value = {
              "version": 2,
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "committed": False,
              "security_codes": [code.strip() for code in os.environ.get("REQUESTED_SECURITY_CODES", "").split(",") if code.strip()],
              "workflow_inputs": json.loads(os.environ.get("WORKFLOW_INPUTS", "{}")),
              "files": [],
          }
          pathlib.Path("recovery-results/manifest.json").write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install and verify PDF text extraction
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pdftotext -v
      - name: Log workflow inputs
        env:
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          SELECTION_DIAGNOSTIC: ${{ inputs.selection_diagnostic }}
          SECURITY_CODES: ${{ inputs.security_codes }}
          COMPANIES_PER_RUN: ${{ inputs.companies_per_run }}
          MAX_OPENAI_CALLS_PER_DAY: ${{ inputs.max_openai_calls_per_day }}
          MAX_OPENAI_BUDGET_JPY_PER_DAY: ${{ inputs.max_openai_budget_jpy_per_day }}
          AUTO_SELECT: ${{ inputs.auto_select }}
          MAX_OPENAI_CALLS_PER_RUN: ${{ inputs.max_openai_calls_per_run }}
          RETRY_RESEARCH_LOG: ${{ inputs.retry_research_log }}
        run: |
          echo "diagnostic_mode=${DIAGNOSTIC_MODE}"
          echo "selection_diagnostic=${SELECTION_DIAGNOSTIC}"
          echo "security_codes=${SECURITY_CODES}"
          echo "companies_per_run=${COMPANIES_PER_RUN}"
          echo "max_openai_calls_per_day=${MAX_OPENAI_CALLS_PER_DAY}"
          echo "max_openai_budget_jpy_per_day=${MAX_OPENAI_BUDGET_JPY_PER_DAY}"
          echo "auto_select=${AUTO_SELECT}"
          echo "max_openai_calls_per_run=${MAX_OPENAI_CALLS_PER_RUN}"
          echo "retry_research_log=${RETRY_RESEARCH_LOG}"
      - name: Test before using the production API
        run: npm test
      - name: Discover free benefit candidates
        id: candidates
        run: python scripts/discover_benefit_candidates.py
      - name: Validate OpenAI configuration without calling the API
        if: ${{ inputs.selection_diagnostic != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: |
          test -n "${OPENAI_API_KEY}" || { echo "::error::OPENAI_API_KEY is empty"; exit 1; }
          case "${OPENAI_API_KEY}" in
            sk-*) ;;
            *) echo "::error::OPENAI_API_KEY does not have the expected OpenAI key prefix"; exit 1 ;;
          esac
          echo "OPENAI_API_KEY is present; value is not printed"
          echo "OpenAI host: api.openai.com"
          echo "OpenAI model: ${OPENAI_MODEL:-gpt-5.4-nano}"
      - name: Verify maintained official sources over real HTTP
        if: ${{ inputs.selection_diagnostic != true }}
        env:
          RUN_LIVE_OFFICIAL_SOURCES: '1'
        run: python -m unittest discover -s tests -p 'test_live_official_sources.py' -v
      - name: Discover from official sources
        id: discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: >-
          python scripts/discover_benefits_with_openai.py
          --companies-per-run '${{ inputs.companies_per_run }}'
          --max-openai-calls-per-run '${{ inputs.max_openai_calls_per_run }}'
          --max-openai-calls-per-day '${{ inputs.max_openai_calls_per_day }}'
          --max-openai-budget-jpy-per-day '${{ inputs.max_openai_budget_jpy_per_day }}'
          --security-codes '${{ inputs.security_codes }}'
          ${{ inputs.auto_select != true && '--no-auto-select' || '' }}
          ${{ inputs.retry_research_log == true && '--retry-research-log' || '' }}
          ${{ inputs.retry_failed == true && '--retry-failed' || '' }}
          ${{ inputs.official_only == true && '--official-only' || '' }}
          ${{ inputs.diagnostic_mode == true && '--diagnostic-mode' || '' }}
          ${{ inputs.selection_diagnostic == true && '--selection-diagnostic' || '' }}
      - name: Finalize recovery bundle
        if: ${{ always() }}
        env:
          WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          REQUESTED_SECURITY_CODES: ${{ inputs.security_codes }}
          DISCOVERY_OUTCOME: ${{ steps.discovery.outcome }}
        run: |
          python scripts/merge_discovery_results.py capture --bundle recovery-results
          python - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('recovery-results/recovery-manifest.json')
          value = json.loads(path.read_text())
          value['workflow_inputs'] = json.loads(os.environ.get('WORKFLOW_INPUTS', '{}'))
          value['requested_security_codes'] = [x.strip() for x in os.environ.get('REQUESTED_SECURITY_CODES', '').split(',') if x.strip()]
          value['discovery_outcome'] = os.environ.get('DISCOVERY_OUTCOME', 'unknown')
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Commit verified results
        id: commit_results
        # Per-company research failures are recorded without failing discovery,
        # so confirmed results still reach this step. A failed test or structural
        # discovery failure blocks the step via success().
        if: ${{ success() && inputs.diagnostic_mode != true && inputs.selection_diagnostic != true }}
        env:
          USE_EXISTING_DISCOVERY_BUNDLE: 'true'
          DISCOVERY_RESULTS_BUNDLE: recovery-results
        run: |
          scripts/commit_discovery_results.sh
      - name: Require recovery manifest
        if: ${{ always() }}
        run: test -f recovery-results/manifest.json && test -f recovery-results/recovery-manifest.json
      - name: Preserve uncommitted discovery results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: discovery-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery-results/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
      - name: Configure GitHub Pages
        if: ${{ steps.commit_results.outputs.committed == 'yes' && steps.discovery.outputs.confirmed != '0' }}
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: ${{ steps.commit_results.outputs.committed == 'yes' && steps.discovery.outputs.confirmed != '0' }}
        uses: actions/upload-pages-artifact@v3
        with: {path: .}
      - name: Deploy GitHub Pages
        if: ${{ steps.commit_results.outputs.committed == 'yes' && steps.discovery.outputs.confirmed != '0' }}
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed shareholder benefits
        if: ${{ steps.commit_results.outputs.committed == 'yes' && steps.discovery.outputs.confirmed != '0' }}
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          url = f"{os.environ['PAGE_URL'].rstrip('/')}/data/benefits.json?v={os.environ['CACHE_BUSTER']}"
          expected_codes = {'7550', '7616', '7412'}
          with open('data/benefits.json', encoding='utf-8') as local_file:
              local_benefits = json.load(local_file)
          expected_confirmed = sum(item.get('benefit_status') == 'official_confirmed' for item in local_benefits)
          expected_all_codes = {str(item.get('code')) for item in local_benefits}
          last_error = None
          for attempt in range(1, 13):
              confirmed = None
              try:
                  request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      benefits = json.load(response)
                  codes = {str(item.get('code')) for item in benefits}
                  if len(benefits) != len(local_benefits) or codes != expected_all_codes:
                      raise AssertionError(
                          "公開サイトとローカルの件数または証券コードが一致しません: "
                          f"expected_count={len(local_benefits)}, actual_count={len(benefits)}, "
                          f"missing={sorted(expected_all_codes - codes)}, extra={sorted(codes - expected_all_codes)}"
                      )
                  missing = expected_codes - codes
                  confirmed = sum(item.get('benefit_status') == 'official_confirmed' for item in benefits)
                  print(
                      f"Attempt {attempt}/12: expected official_confirmed={expected_confirmed}, "
                      f"actual official_confirmed={confirmed}"
                  )
                  if missing:
                      raise AssertionError(f"公開データに証券コードがありません: {sorted(missing)}")
                  if confirmed != expected_confirmed:
                      raise AssertionError(
                          "公開サイトとローカルデータの公式確認済み件数が一致しません: "
                          f"expected={expected_confirmed}, actual={confirmed}"
                      )
                  print(f"Verified {url}: required codes present, official_confirmed={confirmed}")
                  break
              except Exception as error:
                  last_error = error
                  if confirmed is None:
                      print(
                          f"Attempt {attempt}/12: expected official_confirmed={expected_confirmed}, "
                          "actual official_confirmed=unavailable"
                      )
                  if attempt == 12:
                      raise
                  print(f"Attempt {attempt}/12 failed: {error}; retrying in 10 seconds")
                  time.sleep(10)
          PY
      - name: Report workflow outcome
        if: ${{ always() }}
        env:
          CONFIRMED_COUNT: ${{ steps.discovery.outputs.confirmed }}
          RESEARCH_LOG_COUNT: ${{ steps.discovery.outputs.research_log }}
          FAILED_COUNT: ${{ steps.discovery.outputs.failed }}
          OPENAI_CALLS: ${{ steps.discovery.outputs.openai_calls }}
          HIGH_COUNT: ${{ steps.discovery.outputs.high }}
          MEDIUM_COUNT: ${{ steps.discovery.outputs.medium }}
          LOW_COUNT: ${{ steps.discovery.outputs.low }}
          FREE_EXTRACTION_SUCCESS: ${{ steps.discovery.outputs.free_extraction_success }}
          OFFICIAL_DOMAINS_FOUND: ${{ steps.discovery.outputs.official_domains_found }}
          OFFICIAL_URL_CANDIDATES_FOUND: ${{ steps.discovery.outputs.official_url_candidates_found }}
          OFFICIAL_COMPANY_URL_CANDIDATES: ${{ steps.discovery.outputs.official_company_url_candidates }}
          NON_OFFICIAL_URLS_EXCLUDED: ${{ steps.discovery.outputs.non_official_urls_excluded }}
          OFFICIAL_MATERIAL_FETCH_SUCCESS: ${{ steps.discovery.outputs.official_material_fetch_success }}
          POST_OFFICIAL_FETCH_OPENAI_CALLS: ${{ steps.discovery.outputs.post_official_fetch_openai_calls }}
          PRE_OPENAI_EXCLUDED: ${{ steps.discovery.outputs.pre_openai_excluded }}
          UNRESOLVED_COUNT: ${{ steps.discovery.outputs.unresolved }}
          OFFICIAL_HOMEPAGES_FOUND: ${{ steps.discovery.outputs.official_homepages_found }}
          OFFICIAL_IR_PAGES_FOUND: ${{ steps.discovery.outputs.official_ir_pages_found }}
          BENEFIT_PAGES_FOUND: ${{ steps.discovery.outputs.benefit_pages_found }}
          BENEFIT_PAGE_NOT_FOUND: ${{ steps.discovery.outputs.benefit_page_not_found }}
          OFFICIAL_DOMAINS_SAVED: ${{ steps.discovery.outputs.official_domains_saved }}
          RESEARCH_REASONS: ${{ steps.discovery.outputs.research_reasons }}
          ZERO_CONFIRMED_CAUSE: ${{ steps.discovery.outputs.zero_confirmed_cause }}
          OFFICIAL_SITE_403_COUNT: ${{ steps.discovery.outputs.official_site_403_count }}
          OFFICIAL_PDF_403_COUNT: ${{ steps.discovery.outputs.official_pdf_403_count }}
          OPENAI_403_COUNT: ${{ steps.discovery.outputs.openai_403_count }}
          FORBIDDEN_HOSTS: ${{ steps.discovery.outputs['403_hosts'] }}
          STOPPED_OPENAI_AFTER_403: ${{ steps.discovery.outputs.stopped_openai_after_403 }}
          AFFECTED_SECURITY_CODES: ${{ steps.discovery.outputs.affected_security_codes }}
          PRE_OPENAI_THREE_FACTS: ${{ steps.discovery.outputs.pre_openai_three_facts }}
          PRE_OPENAI_TWO_FACTS: ${{ steps.discovery.outputs.pre_openai_two_facts }}
          PRE_OPENAI_SPARSE_SKIPPED: ${{ steps.discovery.outputs.pre_openai_one_or_zero_skipped }}
          OFFICIAL_403_FALLBACK_COMPANIES: ${{ steps.discovery.outputs.official_403_fallback_companies }}
          FALLBACK_CONFIRMED: ${{ steps.discovery.outputs.fallback_confirmed }}
          PARTIAL_SUCCESS: ${{ steps.discovery.outputs.partial_success }}
          FATAL_ERROR: ${{ steps.discovery.outputs.fatal_error }}
          COMMITTED: ${{ steps.commit_results.outputs.committed }}
          NEW_CANDIDATES: ${{ steps.candidates.outputs.new_candidates }}
          TDNET_CANDIDATES: ${{ steps.discovery.outputs.tdnet_candidates }}
          JPX_CANDIDATES: ${{ steps.discovery.outputs.jpx_candidates }}
          ABOLISHED_COUNT: ${{ steps.discovery.outputs.abolished }}
          UPDATED_CANDIDATES: ${{ steps.discovery.outputs.updated_candidates }}
          FULL_SCAN_PROCESSED: ${{ steps.discovery.outputs.full_scan_processed }}
          TDNET_DISCOVERED: ${{ steps.candidates.outputs.tdnet_discovered }}
          JPX_DISCOVERED: ${{ steps.candidates.outputs.jpx_discovered }}
          RESEARCH_LOG_CANDIDATES: ${{ steps.candidates.outputs.research_log_candidates }}
          FULL_SCAN_QUEUE: ${{ steps.discovery.outputs.full_scan_queue }}
          DEDUPLICATED_CANDIDATES: ${{ steps.discovery.outputs.deduplicated_candidates }}
          SELECTED_COUNT: ${{ steps.discovery.outputs.selected }}
        run: |
          committed="${COMMITTED:-no}"
          committed_confirmed_count=0
          committed_research_log_count=0
          committed_failed_count=0
          if [ "$committed" = yes ]; then
            committed_confirmed_count="${CONFIRMED_COUNT:-0}"
            committed_research_log_count="${RESEARCH_LOG_COUNT:-0}"
            committed_failed_count="${FAILED_COUNT:-0}"
          fi
          echo "WORKFLOW SUMMARY: confirmed saved=${CONFIRMED_COUNT:-0} research-log saved=${RESEARCH_LOG_COUNT:-0} failed=${FAILED_COUNT:-0} git committed=${committed}"
          if [ "${CONFIRMED_COUNT:-0}" = 0 ]; then
            echo "::warning::confirmed=0; OpenAI calls=${OPENAI_CALLS:-0}; cause=${ZERO_CONFIRMED_CAUSE:-not_reported}"
          fi
          rate=0
          if [ "${POST_OFFICIAL_FETCH_OPENAI_CALLS:-0}" -gt 0 ]; then
            rate=$((100 * ${CONFIRMED_COUNT:-0} / ${POST_OFFICIAL_FETCH_OPENAI_CALLS:-1}))
          fi
          if [ "$rate" -le 5 ] && [ "${POST_OFFICIAL_FETCH_OPENAI_CALLS:-0}" -gt 0 ]; then
            echo "::warning::confirmed/OpenAI call率が5%以下です (${rate}%)"
          fi
          {
            echo "### Shareholder benefit discovery"
            echo "- 新規候補発見数: ${NEW_CANDIDATES:-0}"
            echo "- confirmedとして保存: ${CONFIRMED_COUNT:-0}"
            echo "- research-logへ保存: ${RESEARCH_LOG_COUNT:-0}"
            echo "- failed: ${FAILED_COUNT:-0}"
            echo "- partial_success: ${PARTIAL_SUCCESS:-false}"
            echo "- fatal_error: ${FATAL_ERROR:-false}"
            echo "- committed_confirmed_count: ${committed_confirmed_count}"
            echo "- committed_research_log_count: ${committed_research_log_count}"
            echo "- committed_failed_count: ${committed_failed_count}"
            echo "- OpenAI API calls: ${OPENAI_CALLS:-0}"
            echo "- high候補数: ${HIGH_COUNT:-0}"
            echo "- medium候補数: ${MEDIUM_COUNT:-0}"
            echo "- TDnet候補数: ${TDNET_CANDIDATES:-0}"
            echo "- JPX候補数: ${JPX_CANDIDATES:-0}"
            echo "- TDnet取得件数: ${TDNET_DISCOVERED:-0}"
            echo "- JPX取得件数: ${JPX_DISCOVERED:-0}"
            echo "- 既存research-log候補件数: ${RESEARCH_LOG_CANDIDATES:-0}"
            echo "- 未調査全社キュー件数: ${FULL_SCAN_QUEUE:-0}"
            echo "- 重複除外後件数: ${DEDUPLICATED_CANDIDATES:-0}"
            echo "- 最終selected件数: ${SELECTED_COUNT:-0}"
            echo "- low候補数: ${LOW_COUNT:-0}"
            echo "- 無料抽出成功数: ${FREE_EXTRACTION_SUCCESS:-0}"
            echo "- 公式ドメイン発見数: ${OFFICIAL_DOMAINS_FOUND:-0}"
            echo "- 公式URL候補発見数: ${OFFICIAL_URL_CANDIDATES_FOUND:-0}"
            echo "- 企業公式URL候補数: ${OFFICIAL_COMPANY_URL_CANDIDATES:-0}"
            echo "- 非公式URL除外数: ${NON_OFFICIAL_URLS_EXCLUDED:-0}"
            echo "- 公式資料取得成功数: ${OFFICIAL_MATERIAL_FETCH_SUCCESS:-0}"
            echo "- abolished数: ${ABOLISHED_COUNT:-0}"
            echo "- updated候補数: ${UPDATED_CANDIDATES:-0}"
            echo "- 全社総当たり処理数: ${FULL_SCAN_PROCESSED:-0}"
            echo "- 公式トップページ発見数: ${OFFICIAL_HOMEPAGES_FOUND:-0}"
            echo "- 公式IRページ発見数: ${OFFICIAL_IR_PAGES_FOUND:-0}"
            echo "- 優待ページ発見数: ${BENEFIT_PAGES_FOUND:-0}"
            echo "- benefit_page_not_found数: ${BENEFIT_PAGE_NOT_FOUND:-0}"
            echo "- 公式ドメイン保存数: ${OFFICIAL_DOMAINS_SAVED:-0}"
            echo "- 公式資料取得後のOpenAI calls: ${POST_OFFICIAL_FETCH_OPENAI_CALLS:-0}"
            if [ "${POST_OFFICIAL_FETCH_OPENAI_CALLS:-0}" -gt 0 ]; then
              echo "- confirmed/OpenAI call率: ${rate}%"
            else
              echo "- confirmed/OpenAI call率: 0%"
            fi
            echo "- OpenAI解析前に除外: ${PRE_OPENAI_EXCLUDED:-0}"
            echo "- OpenAI送信前に3項目発見: ${PRE_OPENAI_THREE_FACTS:-0}"
            echo "- OpenAI送信前に2項目発見: ${PRE_OPENAI_TWO_FACTS:-0}"
            echo "- 1項目以下でOpenAIを省略: ${PRE_OPENAI_SPARSE_SKIPPED:-0}"
            echo "- 403から代替公式資料へ切替: ${OFFICIAL_403_FALLBACK_COMPANIES:-0}"
            echo "- 代替資料でconfirmed: ${FALLBACK_CONFIRMED:-0}"
            echo "- unresolved: ${UNRESOLVED_COUNT:-0}"
            echo "- official_site_403_count: ${OFFICIAL_SITE_403_COUNT:-0}"
            echo "- official_pdf_403_count: ${OFFICIAL_PDF_403_COUNT:-0}"
            echo "- openai_403_count: ${OPENAI_403_COUNT:-0}"
            echo "- 403_hosts: ${FORBIDDEN_HOSTS:-[]}"
            echo "- stopped_openai_after_403: ${STOPPED_OPENAI_AFTER_403:-false}"
            echo "- affected_security_codes: ${AFFECTED_SECURITY_CODES:-[]}"
            processed=$((${CONFIRMED_COUNT:-0} + ${RESEARCH_LOG_COUNT:-0}))
            if [ "$processed" -gt 0 ]; then
              echo "- confirmed率: $((100 * ${CONFIRMED_COUNT:-0} / processed))%"
            else
              echo "- confirmed率: 0%"
            fi
            echo "- research-log理由別件数: ${RESEARCH_REASONS:-{}}"
            echo "- confirmed=0 の原因: ${ZERO_CONFIRMED_CAUSE:-該当なし}"
            echo "- Gitへコミット: ${committed}"
          } >> "$GITHUB_STEP_SUMMARY"
