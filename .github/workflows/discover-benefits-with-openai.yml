name: Discover shareholder benefits with OpenAI
on:
  workflow_dispatch:
    inputs:
      batch_size: {description: 'Companies per run', default: '5', type: string}
      daily_limit: {description: 'Maximum companies per run', default: '20', type: string}
      start_code: {description: 'Optional first security code', required: false, type: string}
      end_code: {description: 'Optional last security code', required: false, type: string}
      retry_failed: {description: 'Retry failed companies', default: false, type: boolean}
      official_only: {description: 'Only register fully official results', default: true, type: boolean}
      diagnostic_mode: {description: 'Diagnose code 1301 without changing data', default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: openai-benefit-discovery, cancel-in-progress: false}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Log workflow inputs
        env:
          DIAGNOSTIC_MODE: ${{ inputs.diagnostic_mode }}
          START_CODE: ${{ inputs.start_code }}
          END_CODE: ${{ inputs.end_code }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          DAILY_LIMIT: ${{ inputs.daily_limit }}
        run: |
          echo "diagnostic_mode=${DIAGNOSTIC_MODE}"
          echo "start_code=${START_CODE}"
          echo "end_code=${END_CODE}"
          echo "batch_size=${BATCH_SIZE}"
          echo "daily_limit=${DAILY_LIMIT}"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Discover from official sources
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: >-
          python scripts/discover_benefits_with_openai.py
          --batch-size '${{ inputs.batch_size }}'
          --daily-limit '${{ inputs.daily_limit }}'
          ${{ inputs.start_code && format('--start-code {0}', inputs.start_code) || '' }}
          ${{ inputs.end_code && format('--end-code {0}', inputs.end_code) || '' }}
          ${{ inputs.retry_failed == true && '--retry-failed' || '' }}
          ${{ inputs.official_only == true && '--official-only' || '' }}
          ${{ inputs.diagnostic_mode == true && '--diagnostic-mode' || '' }}
      - run: npm test
      - name: Commit verified results
        if: ${{ success() && inputs.diagnostic_mode != true }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/benefits.csv data/benefits.json data/verification-queue.json data/discovery-progress.json data/openai-api-usage.json
          echo "Changed files and added/updated record counts before commit:"
          python - <<'PY'
          import csv, io, json, pathlib, subprocess

          changed = subprocess.check_output(
              ["git", "diff", "--cached", "--name-only", "--", "data"], text=True
          ).splitlines()
          for filename in changed:
              path = pathlib.Path(filename)
              current_text = path.read_text(encoding="utf-8")
              try:
                  previous_text = subprocess.check_output(
                      ["git", "show", f"HEAD:{filename}"], text=True, stderr=subprocess.DEVNULL
                  )
              except subprocess.CalledProcessError:
                  previous_text = ""
              if path.suffix == ".csv":
                  current = {row.get("code", str(index)): row for index, row in enumerate(csv.DictReader(io.StringIO(current_text)))}
                  previous = {row.get("code", str(index)): row for index, row in enumerate(csv.DictReader(io.StringIO(previous_text)))}
              else:
                  current_value = json.loads(current_text)
                  previous_value = json.loads(previous_text) if previous_text else []
                  if isinstance(current_value, list):
                      current = {str(row.get("code", index)) if isinstance(row, dict) else str(index): row
                                 for index, row in enumerate(current_value)}
                      previous = {str(row.get("code", index)) if isinstance(row, dict) else str(index): row
                                  for index, row in enumerate(previous_value)}
                  else:
                      current, previous = {"document": current_value}, {"document": previous_value}
              added = len(current.keys() - previous.keys())
              updated = sum(current[key] != previous[key] for key in current.keys() & previous.keys())
              print(f"{filename}: added={added} updated={updated}")
          PY
          echo "Changed line counts:"
          git diff --cached --numstat
          if git diff --cached --quiet; then
            echo "::warning::No data files changed. The discovery step selected no eligible targets or produced no persistable outcome; inspect the Production targets and Production summary logs."
          else
            git commit -m "chore: update OpenAI benefit discovery"
            git push
          fi
