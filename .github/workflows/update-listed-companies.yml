name: Update JPX listed companies
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'
permissions: {contents: write}
concurrency: {group: shareholder-data-main, cancel-in-progress: false}
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'xlrd==2.0.1'
      - name: Download and validate official JPX master
        run: python scripts/update_listed_companies_from_jpx.py
      - name: Validate JSON
        run: python -m json.tool data/listed-companies.json >/dev/null
      - name: Commit only a changed, valid master
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/listed-companies.json data/discovery-progress.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: update listed companies from JPX"
          git push origin HEAD:main
