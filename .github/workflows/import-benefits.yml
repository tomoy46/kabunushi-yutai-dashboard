name: Legacy - Import shareholder benefits CSV (旧・個別実行用)
on:
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: shareholder-data-main, cancel-in-progress: false}
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Validate and import CSV (no external API)
        run: python scripts/import_benefits.py
      - name: Run regression tests
        run: npm test
      - name: Commit imported benefits
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/benefits.csv data/benefits.json
          git diff --cached --quiet || git commit -m "chore: import shareholder benefits CSV"
          git push
