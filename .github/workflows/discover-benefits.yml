name: Discover shareholder benefits with Gemini (legacy, manual only)
on:
  workflow_dispatch:
    inputs:
      batch_size: {description: 'Companies per run (max 100)', default: '100', type: string}
      daily_limit: {description: 'Maximum companies charged in this run/day', default: '100', type: string}
      start_code: {description: 'Optional first security code', required: false, type: string}
      end_code: {description: 'Optional last security code', required: false, type: string}
      retry_failed: {description: 'Retry failed companies', default: false, type: boolean}
      official_only: {description: 'Skip current verification queue', default: false, type: boolean}
      diagnostic_mode: {description: 'Test both Gemini stages with one company without registering data', default: false, type: boolean}
permissions: {contents: write}
concurrency: {group: gemini-benefit-discovery, cancel-in-progress: false}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Ensure the JPX listed-company master is ready
        run: |
          python - <<'PY'
          import json
          companies = json.load(open('data/listed-companies.json', encoding='utf-8'))
          if len(companies) <= 12:
              raise SystemExit('上場会社マスターが未更新です。先に Update JPX listed companies を実行してください。')
          print(f'上場会社マスター: {len(companies)}社')
          PY
      - name: Discover from official sources
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_SEARCH_MODEL: ${{ vars.GEMINI_SEARCH_MODEL }}
          GEMINI_EXTRACTION_MODEL: ${{ vars.GEMINI_EXTRACTION_MODEL }}
        run: >-
          python scripts/discover_benefits_with_gemini.py
          --batch-size '${{ inputs.batch_size }}'
          --daily-limit '${{ inputs.daily_limit }}'
          ${{ inputs.start_code && format('--start-code {0}', inputs.start_code) || '' }}
          ${{ inputs.end_code && format('--end-code {0}', inputs.end_code) || '' }}
          ${{ inputs.retry_failed && '--retry-failed' || '' }}
          ${{ inputs.official_only && '--official-only' || '' }}
          ${{ inputs.diagnostic_mode && '--diagnostic-mode' || '' }}
      - run: npm test
      - name: Commit checkpoint and results
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/benefits.json data/verification-queue.json data/discovery-progress.json data/api-usage.json data/company-domains.json
          git diff --cached --quiet || git commit -m "chore: update Gemini benefit discovery"
          git push
